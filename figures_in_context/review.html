<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figures in Context Review</title>
<style>
:root{
  --tinte:#1B2430; --schiefer:#5B6672; --linie:#D5DBE1; --grund:#EEF1F4; --blatt:#FFFFFF;
  --gruen:#2E6B4F; --gruen-hell:#E3F0E8; --rot:#B3261E; --rot-hell:#F8E3E1; --bernstein:#C98A1B;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--grund);color:var(--tinte);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bernstein);outline-offset:2px}

.kopf{display:flex;align-items:center;gap:1.25rem;padding:.6rem 1.25rem;background:var(--tinte);color:#fff}
.kopf h1{font-size:1rem;font-weight:600;margin:0;white-space:nowrap}
.fortschritt{flex:1;display:flex;align-items:center;gap:.75rem;min-width:0}
.balken{flex:1;height:6px;background:#3A4656;border-radius:3px;overflow:hidden}
.balken i{display:block;height:100%;background:#7FC29B;width:0;transition:width .3s}
.fortschritt span{font-size:.85rem;white-space:nowrap;color:#C9D1DA}
.kopf label{font-size:.85rem;color:#C9D1DA;display:flex;align-items:center;gap:.4rem}
.kopf input{background:#2A3544;border:1px solid #3A4656;border-radius:4px;padding:.2rem .5rem;color:#fff;width:9rem}

.rahmen{display:grid;grid-template-columns:13rem 1fr;height:calc(100% - 46px)}
.liste{overflow:auto;border-right:1px solid var(--linie);background:var(--blatt)}
.liste button{display:flex;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.45rem .9rem;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.liste button:hover{background:var(--grund)}
.liste button[aria-current="true"]{background:#DCE3EA;font-weight:600}
.punkt{width:.6rem;height:.6rem;border-radius:50%;border:1.5px solid var(--schiefer);flex:none}
.punkt.ok{background:var(--gruen);border-color:var(--gruen)}
.punkt.fehler{background:var(--rot);border-color:var(--rot)}
.liste small{color:var(--schiefer);margin-left:auto}

main{overflow:auto;padding:1.5rem 2rem 9rem}
.fall{max-width:68rem}
.frage{font-size:1.15rem;line-height:1.45;margin:.25rem 0 1.25rem;max-width:60rem}
.meta{color:var(--schiefer);font-size:.85rem}

/* Der Kern: Musterlösung und KI-Ergebnis Ziffer für Ziffer */
.vergleich{background:var(--blatt);border:1px solid var(--linie);border-radius:6px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.25rem;align-items:baseline}
.vergleich dt{color:var(--schiefer);font-size:.85rem}
.vergleich dd{margin:0;font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:pre}
.vergleich dd .x{background:var(--rot-hell);color:var(--rot);border-radius:2px}
.vergleich .einheit{font-size:1rem;color:var(--schiefer);margin-left:.4rem}
.urteil{grid-column:1/-1;font-size:.9rem;font-weight:600;margin-top:.25rem}
.urteil.richtig{color:var(--gruen)} .urteil.falsch{color:var(--rot)}

.spalten{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.25rem}
section h2{font-size:.9rem;font-weight:600;color:var(--schiefer);margin:0 0 .4rem}
.antwort{background:var(--blatt);border:1px solid var(--linie);border-radius:6px;padding:1rem 1.1rem;white-space:pre-wrap;font-size:.92rem;line-height:1.55;max-height:32rem;overflow:auto}
.befund{background:var(--blatt);border:1px solid var(--linie);border-left:4px solid var(--linie);border-radius:4px;padding:.55rem .8rem;margin-bottom:.5rem;font-size:.9rem}
.befund.flag{border-left-color:var(--rot)}
.befund.ok{border-left-color:var(--gruen)}
.befund b{font-weight:600}
.befund .typ{font-family:var(--mono);font-size:.8rem;color:var(--rot);margin-left:.35rem}
.fallen{margin:.25rem 0 0;padding-left:1.1rem;font-size:.9rem}
.fallen li{margin-bottom:.25rem}

details{margin-top:1.25rem}
summary{cursor:pointer;color:var(--schiefer);font-size:.9rem}
.dokument{background:var(--blatt);border:1px solid var(--linie);border-radius:6px;padding:1rem 1.1rem;white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;line-height:1.5;margin-top:.5rem;max-height:30rem;overflow:auto}

.leiste{position:fixed;left:13rem;right:0;bottom:0;background:var(--blatt);border-top:1px solid var(--linie);padding:.75rem 2rem;display:grid;grid-template-columns:1fr auto;gap:.6rem 1.25rem;align-items:start;box-shadow:0 -4px 16px rgba(27,36,48,.06)}
.typen{display:flex;flex-wrap:wrap;gap:.4rem}
.typen button{border:1.5px solid var(--linie);background:var(--blatt);border-radius:999px;padding:.25rem .75rem .25rem .5rem;cursor:pointer;font-size:.88rem;display:flex;align-items:center;gap:.45rem}
.typen button kbd{font-family:var(--mono);font-size:.75rem;color:var(--schiefer);border:1px solid var(--linie);border-radius:3px;padding:0 .3rem}
.typen button[aria-pressed="true"]{border-color:var(--rot);background:var(--rot-hell);color:var(--rot)}
.typen .fehlerfrei{font-size:.85rem;color:var(--gruen);align-self:center;margin-left:.25rem}
.leiste textarea{grid-column:1;width:100%;min-height:2.3rem;height:2.3rem;resize:vertical;border:1px solid var(--linie);border-radius:4px;padding:.4rem .6rem;font-size:.9rem}
.aktionen{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:stretch;gap:.4rem}
.weiter{background:var(--tinte);color:#fff;border:0;border-radius:5px;padding:.6rem 1.1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.weiter:hover{background:#2A3544}
.hinweis{font-size:.78rem;color:var(--schiefer);text-align:center}
.status{font-size:.8rem;color:var(--gruen);text-align:center;min-height:1.1em}

.fertig{max-width:36rem;margin:4rem auto;text-align:center}
body.probe .rahmen{height:calc(100% - 46px - 1.95rem)}
.probe-band{background:var(--bernstein);color:#2A1D05;font-size:.85rem;font-weight:600;padding:.35rem 1.25rem}
.fertig a.weiter{display:inline-block;text-decoration:none}
.zurueck{color:#C9D1DA;text-decoration:none;font-size:.85rem;white-space:nowrap}
.zurueck:hover{color:#fff}
.fertig code{font-family:var(--mono);background:var(--blatt);border:1px solid var(--linie);padding:.2rem .5rem;border-radius:4px}

@media (max-width:900px){
  .kopf{flex-wrap:wrap;gap:.4rem .75rem;padding:.5rem 1rem}
  .fortschritt{order:3;flex-basis:100%}
  .kopf label{margin-left:auto}
  .kopf input{width:7rem}
  .rahmen,body.probe .rahmen{grid-template-columns:1fr;height:auto}
  .liste{display:none}
  .spalten{grid-template-columns:1fr}
  .leiste{left:0;padding:.75rem 1rem;grid-template-columns:1fr}
  .aktionen{grid-row:auto;grid-column:1}
  main{padding:1rem 1rem 14rem}
  .vergleich dd{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){.balken i{transition:none}}
</style>
</head>
<body>
<header class="kopf">
  <a id="zurueck" class="zurueck" href="../../" hidden>← Übersicht</a>
  <h1 id="titel">Review</h1>
  <div class="fortschritt"><div class="balken"><i id="balken"></i></div><span id="zaehler"></span></div>
  <label>Reviewer <input id="reviewer" autocomplete="name"></label>
</header>
<div class="probe-band" id="probe-band" hidden>Probelauf mit Testmodellen: Antworten und Judge-Urteile sind zufällig erzeugt, um den Ablauf zu üben. Die gemeldeten Fehler sind keine echten Befunde.</div>
<div class="rahmen">
  <nav class="liste" id="liste" aria-label="Fälle"></nav>
  <main id="haupt"></main>
</div>
<div class="leiste" id="leiste" hidden>
  <div class="typen" id="typen" role="group" aria-label="Fehlertypen"></div>
  <textarea id="kommentar" placeholder="Kommentar (optional)"></textarea>
  <div class="aktionen">
    <button class="weiter" id="weiter">Geprüft, weiter</button>
    <div class="hinweis">Enter · Ziffern 1–5 · ← →</div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</div>

<script>
const NAMEN = {
  falsches_ergebnis: "Falsches Ergebnis",
  falsche_quelle: "Falsche Quelle",
  erfundene_zahl: "Erfundene Zahl",
  falsch_gerechnet: "Falsch gerechnet",
  ausgelassene_information: "Ausgelassene Info",
};
let FAELLE = [], TYPEN = [], aktuell = 0;
const $ = id => document.getElementById(id);

function speicherLokal(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
function ladeLokal(k){ try{ return localStorage.getItem(k) || "" }catch(e){ return "" } }

function typenVon(f){ return (f.fehlertypen_final || "").split(",").filter(Boolean) }

function kiWert(f){
  const m = /KI:\s*(\S+)\s*(.*)\)\s*$/.exec(f.python_ergebnis || "");
  return m ? {wert: m[1], einheit: m[2]} : {wert: "", einheit: ""};
}
function teile(s){ const [a, b=""] = s.split("."); return {a, b} }

// Beide Zahlen am Dezimalpunkt ausrichten und im KI-Ergebnis die abweichenden Ziffern markieren.
function ausgerichtet(soll, ist){
  const S = teile(soll), I = teile(ist);
  const vorne = Math.max(S.a.length, I.a.length), hinten = Math.max(S.b.length, I.b.length);
  const form = t => t.a.padStart(vorne, " ") + (hinten ? (t.b ? "." : " ") + t.b.padEnd(hinten, " ") : "");
  const fs = form(S), fi = form(I);
  const mark = (x, y) => [...x].map((c, i) => c !== y[i] && c !== " " ? `<span class="x">${c}</span>` : esc(c)).join("");
  return [esc(fs), mark(fi, fs)];
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }

function zeigeListe(){
  $("liste").innerHTML = FAELLE.map((f, i) => {
    const klasse = f.geprueft ? (typenVon(f).length ? "fehler" : "ok") : "";
    return `<button data-i="${i}" aria-current="${i === aktuell}"><span class="punkt ${klasse}"></span>Fall ${esc(f.fall_nr)}<small>${esc(f.testfall_id)}</small></button>`;
  }).join("");
  const n = FAELLE.filter(f => f.geprueft).length;
  $("zaehler").textContent = `${n} von ${FAELLE.length} geprüft`;
  $("balken").style.width = (FAELLE.length ? 100 * n / FAELLE.length : 0) + "%";
}

function zeigeFall(){
  if (!FAELLE.length){
    $("haupt").innerHTML = `<div class="fertig"><h2>Keine Fälle zum Prüfen</h2><p>In diesem Lauf hat nichts ein Review gebraucht.</p></div>`;
    $("leiste").hidden = true; return;
  }
  const f = FAELLE[aktuell];
  const [mw, me] = (f.musterloesung || "").split(/\s+(.*)/);
  const ki = kiWert(f);
  const [sollHtml, istHtml] = ausgerichtet(mw || "", ki.wert);
  const richtig = (f.python_ergebnis || "").startsWith("richtig");
  const befunde = (f.judge_befunde || "").split("\n").filter(Boolean).map(z => {
    const m = /^\[(\w+)\]\s+(FLAG|ok)\s*([\w,]*):\s*(.*)$/s.exec(z);
    if (!m) return `<div class="befund">${esc(z)}</div>`;
    const name = {zahlen:"Zahlen-Judge", rechenweg:"Rechenweg-Judge", plausibilitaet:"Plausibilitäts-Judge"}[m[1]] || m[1];
    const typ = m[3] ? `<span class="typ">${esc(m[3])}</span>` : "";
    return `<div class="befund ${m[2] === "FLAG" ? "flag" : "ok"}"><b>${name}</b> ${m[2] === "FLAG" ? "meldet" : "ok"}${typ}<br>${esc(m[4])}</div>`;
  }).join("");
  const fallen = (f.fallen || "").split(" | ").filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("");

  $("haupt").innerHTML = `<article class="fall">
    <div class="meta">Fall ${esc(f.fall_nr)} von ${FAELLE.length} · Testfall ${esc(f.testfall_id)}</div>
    <p class="frage">${esc(f.frage)}</p>
    <dl class="vergleich">
      <dt>Musterlösung</dt><dd>${sollHtml}<span class="einheit">${esc(me || "")}</span></dd>
      <dt>KI-Ergebnis</dt><dd>${istHtml}<span class="einheit">${esc(ki.einheit)}</span></dd>
      <div class="urteil ${richtig ? "richtig" : "falsch"}">${richtig ? "Python-Check: Ergebnis stimmt" : "Python-Check: Ergebnis falsch"}</div>
    </dl>
    <div class="spalten">
      <section><h2>Antwort der KI</h2><div class="antwort">${esc(f.antwort_text)}</div></section>
      <section><h2>Befunde der Judges</h2>${befunde}
        ${fallen ? `<h2 style="margin-top:1rem">Bekannte Fallen in diesem Testfall</h2><ul class="fallen">${fallen}</ul>` : ""}
      </section>
    </div>
    <details id="dok"><summary>Dokument anzeigen (${esc(f.dokument_datei)}, Seite ${esc(f.dokument_seite)}) · Taste D</summary><div class="dokument">${esc(f.dokument)}</div></details>
  </article>`;
  $("haupt").scrollTop = 0;
  $("leiste").hidden = false;
  zeigeTypen();
  $("kommentar").value = f.kommentar || "";
  $("status").textContent = f.geprueft ? "Bereits geprüft" : "";
  zeigeListe();
}

function zeigeTypen(){
  const gewaehlt = typenVon(FAELLE[aktuell]);
  $("typen").innerHTML = TYPEN.map((t, i) =>
    `<button data-typ="${t}" aria-pressed="${gewaehlt.includes(t)}"><kbd>${i + 1}</kbd>${NAMEN[t] || t}</button>`
  ).join("") + (gewaehlt.length ? "" : `<span class="fehlerfrei">Keine Fehler gewählt: zählt als fehlerfrei</span>`);
}

async function speichere(geprueft){
  const f = FAELLE[aktuell];
  f.kommentar = $("kommentar").value;
  f.reviewer = $("reviewer").value;
  if (geprueft !== undefined) f.geprueft = geprueft ? "x" : "";
  const antwort = await fetch("api/speichern", {method: "POST", headers: {"Content-Type": "application/json", "X-Figures-In-Context": "1"},
    body: JSON.stringify({fall_nr: f.fall_nr, fehlertypen: typenVon(f), kommentar: f.kommentar, reviewer: f.reviewer, geprueft: !!f.geprueft})});
  $("status").textContent = antwort.ok ? "Gespeichert" : "Speichern fehlgeschlagen. Läuft das Fenster von Figures in Context noch?";
  $("status").style.color = antwort.ok ? "" : "var(--rot)";
  return antwort.ok;
}

function umschalten(t){
  const f = FAELLE[aktuell], liste = typenVon(f);
  f.fehlertypen_final = (liste.includes(t) ? liste.filter(x => x !== t) : [...liste, t]).join(",");
  zeigeTypen(); speichere();
}

function gehe(i){
  if (i < 0 || i >= FAELLE.length) return;
  aktuell = i; zeigeFall();
}

async function weiter(){
  if (!(await speichere(true))) return;
  const naechster = FAELLE.findIndex((f, i) => i > aktuell && !f.geprueft);
  const offen = naechster >= 0 ? naechster : FAELLE.findIndex(f => !f.geprueft);
  if (offen >= 0) gehe(offen);
  else {
    zeigeListe();
    $("haupt").innerHTML = `<div class="fertig"><h2>Alle ${FAELLE.length} Fälle geprüft</h2>
      ${IN_APP
        ? `<p>Die Ergebnisse stehen in <code>review_ergebnis.csv</code>. Zurück in der Übersicht erstellst du den Report.</p>
           <p><a class="weiter" href="../../#${encodeURIComponent(LAUF)}">Zur Übersicht</a></p>`
        : `<p>Die Ergebnisse stehen in <code>review_ergebnis.csv</code>. Beende die Oberfläche im Terminal mit Strg+C und erstelle den Report:</p>
           <p><code>python -m figures_in_context auswertung ${esc(LAUF)}</code></p>`}</div>`;
    $("leiste").hidden = true;
  }
}

document.addEventListener("keydown", e => {
  const imFeld = ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName);
  if (e.key === "Enter" && (!imFeld || e.ctrlKey || e.metaKey)) { e.preventDefault(); weiter(); return; }
  if (imFeld || $("leiste").hidden) return;
  if (/^[1-9]$/.test(e.key) && TYPEN[+e.key - 1]) umschalten(TYPEN[+e.key - 1]);
  else if (e.key === "ArrowRight") gehe(aktuell + 1);
  else if (e.key === "ArrowLeft") gehe(aktuell - 1);
  else if (e.key.toLowerCase() === "d") { const d = $("dok"); if (d) d.open = !d.open; }
});
$("typen").addEventListener("click", e => { const b = e.target.closest("button"); if (b) umschalten(b.dataset.typ) });
$("liste").addEventListener("click", e => { const b = e.target.closest("button"); if (b) gehe(+b.dataset.i) });
$("weiter").addEventListener("click", weiter);
$("kommentar").addEventListener("change", () => speichere());
$("reviewer").addEventListener("change", () => speicherLokal("reviewer", $("reviewer").value));

const IN_APP = location.pathname.startsWith("/review/");
let LAUF = "<lauf>";
fetch("api/faelle").then(r => r.json()).then(d => {
  if (!d.faelle) throw new Error(d.fehler);
  LAUF = d.lauf;
  if (d.test) { $("probe-band").hidden = false; document.body.classList.add("probe"); }
  if (IN_APP) { $("zurueck").hidden = false; $("zurueck").href = "../../#" + encodeURIComponent(LAUF); }
  FAELLE = d.faelle; TYPEN = d.fehlertypen;
  document.title = "Figures in Context Review – " + d.lauf;
  $("titel").textContent = "Review " + d.lauf;
  $("reviewer").value = ladeLokal("reviewer") || (FAELLE.find(f => f.reviewer) || {}).reviewer || "";
  const offen = FAELLE.findIndex(f => !f.geprueft);
  aktuell = offen >= 0 ? offen : 0;
  zeigeFall();
}).catch(e => { $("haupt").innerHTML = `<div class="fertig"><h2>Review nicht verfügbar</h2><p>${e.message && e.message !== "Failed to fetch" ? esc(e.message) : "Keine Verbindung. Läuft das Fenster mit Figures in Context noch?"}</p></div>`; $("leiste").hidden = true; });
</script>
</body>
</html>
