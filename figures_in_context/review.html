<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figures in Context Review</title>
<style>
:root{
  --ink:#1B2430; --slate:#5B6672; --line:#D5DBE1; --ground:#EEF1F4; --paper:#FFFFFF;
  --green:#2E6B4F; --green-light:#E3F0E8; --red:#B3261E; --red-light:#F8E3E1; --amber:#C98A1B;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.head{display:flex;align-items:center;gap:1.25rem;padding:.6rem 1.25rem;background:var(--ink);color:#fff}
.head h1{font-size:1rem;font-weight:600;margin:0;white-space:nowrap}
.progress{flex:1;display:flex;align-items:center;gap:.75rem;min-width:0}
.bar{flex:1;height:6px;background:#3A4656;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#7FC29B;width:0;transition:width .3s}
.progress span{font-size:.85rem;white-space:nowrap;color:#C9D1DA}
.head label{font-size:.85rem;color:#C9D1DA;display:flex;align-items:center;gap:.4rem}
.head input{background:#2A3544;border:1px solid #3A4656;border-radius:4px;padding:.2rem .5rem;color:#fff;width:9rem}

.frame{display:grid;grid-template-columns:13rem 1fr;height:calc(100% - 46px)}
.list{overflow:auto;border-right:1px solid var(--line);background:var(--paper)}
.list button{display:flex;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.45rem .9rem;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.list button:hover{background:var(--ground)}
.list button[aria-current="true"]{background:#DCE3EA;font-weight:600}
.dot{width:.6rem;height:.6rem;border-radius:50%;border:1.5px solid var(--slate);flex:none}
.dot.ok{background:var(--green);border-color:var(--green)}
.dot.error{background:var(--red);border-color:var(--red)}
.list small{color:var(--slate);margin-left:auto}

main{overflow:auto;padding:1.5rem 2rem 9rem}
.case{max-width:68rem}
.question{font-size:1.15rem;line-height:1.45;margin:.25rem 0 1.25rem;max-width:60rem}
.meta{color:var(--slate);font-size:.85rem}

/* The core: reference answer and AI result digit by digit */
.compare{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1rem 1.25rem;margin-bottom:1.25rem;display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.25rem;align-items:baseline}
.compare dt{color:var(--slate);font-size:.85rem}
.compare dd{margin:0;font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:pre}
.compare dd .x{background:var(--red-light);color:var(--red);border-radius:2px}
.compare .unit{font-size:1rem;color:var(--slate);margin-left:.4rem}
.outcome{grid-column:1/-1;font-size:.9rem;font-weight:600;margin-top:.25rem}
.outcome.correct{color:var(--green)} .outcome.wrong{color:var(--red)}

.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.25rem}
section h2{font-size:.9rem;font-weight:600;color:var(--slate);margin:0 0 .4rem}
.answer{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem;white-space:pre-wrap;font-size:.92rem;line-height:1.55;max-height:32rem;overflow:auto}
.finding{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:4px;padding:.55rem .8rem;margin-bottom:.5rem;font-size:.9rem}
.finding.flag{border-left-color:var(--red)}
.finding.ok{border-left-color:var(--green)}
.finding b{font-weight:600}
.finding .type{font-family:var(--mono);font-size:.8rem;color:var(--red);margin-left:.35rem}
.traps{margin:.25rem 0 0;padding-left:1.1rem;font-size:.9rem}
.traps li{margin-bottom:.25rem}

details{margin-top:1.25rem}
summary{cursor:pointer;color:var(--slate);font-size:.9rem}
.document{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1rem 1.1rem;white-space:pre-wrap;font-family:var(--mono);font-size:.8rem;line-height:1.5;margin-top:.5rem;max-height:30rem;overflow:auto}

.bottom{position:fixed;left:13rem;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:.75rem 2rem;display:grid;grid-template-columns:1fr auto;gap:.6rem 1.25rem;align-items:start;box-shadow:0 -4px 16px rgba(27,36,48,.06)}
.types{display:flex;flex-wrap:wrap;gap:.4rem}
.types button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .75rem .25rem .5rem;cursor:pointer;font-size:.88rem;display:flex;align-items:center;gap:.45rem}
.types button kbd{font-family:var(--mono);font-size:.75rem;color:var(--slate);border:1px solid var(--line);border-radius:3px;padding:0 .3rem}
.types button[aria-pressed="true"]{border-color:var(--red);background:var(--red-light);color:var(--red)}
.types .clean{font-size:.85rem;color:var(--green);align-self:center;margin-left:.25rem}
.bottom textarea{grid-column:1;width:100%;min-height:2.3rem;height:2.3rem;resize:vertical;border:1px solid var(--line);border-radius:4px;padding:.4rem .6rem;font-size:.9rem}
.actions{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:stretch;gap:.4rem}
.next{background:var(--ink);color:#fff;border:0;border-radius:5px;padding:.6rem 1.1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.next:hover{background:#2A3544}
.hint{font-size:.78rem;color:var(--slate);text-align:center}
.status{font-size:.8rem;color:var(--green);text-align:center;min-height:1.1em}

.finished{max-width:36rem;margin:4rem auto;text-align:center}
body.test .frame{height:calc(100% - 46px - 1.95rem)}
.test-band{background:var(--amber);color:#2A1D05;font-size:.85rem;font-weight:600;padding:.35rem 1.25rem}
.finished a.next{display:inline-block;text-decoration:none}
.back{color:#C9D1DA;text-decoration:none;font-size:.85rem;white-space:nowrap}
.back:hover{color:#fff}
.finished code{font-family:var(--mono);background:var(--paper);border:1px solid var(--line);padding:.2rem .5rem;border-radius:4px}

@media (max-width:900px){
  .head{flex-wrap:wrap;gap:.4rem .75rem;padding:.5rem 1rem}
  .progress{order:3;flex-basis:100%}
  .head label{margin-left:auto}
  .head input{width:7rem}
  .frame,body.test .frame{grid-template-columns:1fr;height:auto}
  .list{display:none}
  .columns{grid-template-columns:1fr}
  .bottom{left:0;padding:.75rem 1rem;grid-template-columns:1fr}
  .actions{grid-row:auto;grid-column:1}
  main{padding:1rem 1rem 14rem}
  .compare dd{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header class="head">
  <a id="back" class="back" href="../../" hidden>← Overview</a>
  <h1 id="title">Review</h1>
  <div class="progress"><div class="bar"><i id="bar"></i></div><span id="counter"></span></div>
  <label>Reviewer <input id="reviewer" autocomplete="name"></label>
</header>
<div class="test-band" id="test-band" hidden>Test run with test models: answers and judge verdicts are generated at random so you can practise the flow. The reported errors are not real findings.</div>
<div class="frame">
  <nav class="list" id="list" aria-label="Cases"></nav>
  <main id="main"></main>
</div>
<div class="bottom" id="bottom" hidden>
  <div class="types" id="types" role="group" aria-label="Error types"></div>
  <textarea id="comment" placeholder="Comment (optional)"></textarea>
  <div class="actions">
    <button class="next" id="next">Checked, next</button>
    <div class="hint">Enter · keys 1–5 · ← →</div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</div>

<script>
const NAMES = {
  wrong_result: "Wrong result",
  wrong_source: "Wrong source",
  invented_number: "Invented number",
  calculation_error: "Calculation error",
  missing_information: "Missing information",
};
const JUDGES = {numbers: "Numbers judge", calculation: "Calculation judge", plausibility: "Plausibility judge"};
let CASES = [], TYPES = [], current = 0;
const $ = id => document.getElementById(id);

function storeLocal(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
function loadLocal(k){ try{ return localStorage.getItem(k) || "" }catch(e){ return "" } }

function typesOf(c){ return (c.final_error_types || "").split(",").filter(Boolean) }

function aiValue(c){
  const m = /AI:\s*(\S+)\s*(.*)\)\s*$/.exec(c.python_result || "");
  return m ? {value: m[1], unit: m[2]} : {value: "", unit: ""};
}
function parts(s){ const [a, b=""] = s.split("."); return {a, b} }

// Align both numbers on the decimal point and mark the digits in the AI result that differ.
function aligned(expected, actual){
  const E = parts(expected), A = parts(actual);
  const front = Math.max(E.a.length, A.a.length), back = Math.max(E.b.length, A.b.length);
  const form = t => t.a.padStart(front, " ") + (back ? (t.b ? "." : " ") + t.b.padEnd(back, " ") : "");
  const fe = form(E), fa = form(A);
  const mark = (x, y) => [...x].map((c, i) => c !== y[i] && c !== " " ? `<span class="x">${c}</span>` : esc(c)).join("");
  return [esc(fe), mark(fa, fe)];
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }

function showList(){
  $("list").innerHTML = CASES.map((c, i) => {
    const state = c.checked ? (typesOf(c).length ? "error" : "ok") : "";
    return `<button data-i="${i}" aria-current="${i === current}"><span class="dot ${state}"></span>Case ${esc(c.case_no)}<small>${esc(c.case_id)}</small></button>`;
  }).join("");
  const n = CASES.filter(c => c.checked).length;
  $("counter").textContent = `${n} of ${CASES.length} checked`;
  $("bar").style.width = (CASES.length ? 100 * n / CASES.length : 0) + "%";
}

function showCase(){
  if (!CASES.length){
    $("main").innerHTML = `<div class="finished"><h2>No cases to check</h2><p>Nothing in this run needed a review.</p></div>`;
    $("bottom").hidden = true; return;
  }
  const c = CASES[current];
  const [refValue, refUnit] = (c.reference_answer || "").split(/\s+(.*)/);
  const ai = aiValue(c);
  const [expectedHtml, actualHtml] = aligned(refValue || "", ai.value);
  const correct = (c.python_result || "").startsWith("correct");
  const findings = (c.judge_findings || "").split("\n").filter(Boolean).map(line => {
    const m = /^\[(\w+)\]\s+(FLAG|ok)\s*([\w,]*):\s*(.*)$/s.exec(line);
    if (!m) return `<div class="finding">${esc(line)}</div>`;
    const name = JUDGES[m[1]] || m[1];
    const type = m[3] ? `<span class="type">${esc(m[3])}</span>` : "";
    return `<div class="finding ${m[2] === "FLAG" ? "flag" : "ok"}"><b>${name}</b> ${m[2] === "FLAG" ? "reports" : "ok"}${type}<br>${esc(m[4])}</div>`;
  }).join("");
  const traps = (c.traps || "").split(" | ").filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("");

  $("main").innerHTML = `<article class="case">
    <div class="meta">Case ${esc(c.case_no)} of ${CASES.length} · test case ${esc(c.case_id)}</div>
    <p class="question">${esc(c.question)}</p>
    <dl class="compare">
      <dt>Reference answer</dt><dd>${expectedHtml}<span class="unit">${esc(refUnit || "")}</span></dd>
      <dt>AI result</dt><dd>${actualHtml}<span class="unit">${esc(ai.unit)}</span></dd>
      <div class="outcome ${correct ? "correct" : "wrong"}">${correct ? "Python check: result is correct" : "Python check: result is wrong"}</div>
    </dl>
    <div class="columns">
      <section><h2>The AI's answer</h2><div class="answer">${esc(c.answer_text)}</div></section>
      <section><h2>Judge findings</h2>${findings}
        ${traps ? `<h2 style="margin-top:1rem">Known traps in this test case</h2><ul class="traps">${traps}</ul>` : ""}
      </section>
    </div>
    <details id="doc"><summary>Show document (${esc(c.document_file)}, page ${esc(c.document_page)}) · key D</summary><div class="document">${esc(c.document)}</div></details>
  </article>`;
  $("main").scrollTop = 0;
  $("bottom").hidden = false;
  showTypes();
  $("comment").value = c.comment || "";
  $("status").textContent = c.checked ? "Already checked" : "";
  showList();
}

function showTypes(){
  const chosen = typesOf(CASES[current]);
  $("types").innerHTML = TYPES.map((t, i) =>
    `<button data-type="${t}" aria-pressed="${chosen.includes(t)}"><kbd>${i + 1}</kbd>${NAMES[t] || t}</button>`
  ).join("") + (chosen.length ? "" : `<span class="clean">No errors chosen: counts as clean</span>`);
}

async function save(checked){
  const c = CASES[current];
  c.comment = $("comment").value;
  c.reviewer = $("reviewer").value;
  if (checked !== undefined) c.checked = checked ? "x" : "";
  const response = await fetch("api/save", {method: "POST", headers: {"Content-Type": "application/json", "X-Figures-In-Context": "1"},
    body: JSON.stringify({case_no: c.case_no, error_types: typesOf(c), comment: c.comment, reviewer: c.reviewer, checked: !!c.checked})});
  $("status").textContent = response.ok ? "Saved" : "Saving failed. Is the Figures in Context window still open?";
  $("status").style.color = response.ok ? "" : "var(--red)";
  return response.ok;
}

function toggle(t){
  const c = CASES[current], list = typesOf(c);
  c.final_error_types = (list.includes(t) ? list.filter(x => x !== t) : [...list, t]).join(",");
  showTypes(); save();
}

function go(i){
  if (i < 0 || i >= CASES.length) return;
  current = i; showCase();
}

async function next(){
  if (!(await save(true))) return;
  const following = CASES.findIndex((c, i) => i > current && !c.checked);
  const open = following >= 0 ? following : CASES.findIndex(c => !c.checked);
  if (open >= 0) go(open);
  else {
    showList();
    $("main").innerHTML = `<div class="finished"><h2>All ${CASES.length} cases checked</h2>
      ${IN_APP
        ? `<p>The results are in <code>review_results.csv</code>. Back in the overview you can create the report.</p>
           <p><a class="next" href="../../#${encodeURIComponent(RUN)}">To the overview</a></p>`
        : `<p>The results are in <code>review_results.csv</code>. Stop the interface in the terminal with Ctrl+C and create the report:</p>
           <p><code>python -m figures_in_context report ${esc(RUN)}</code></p>`}</div>`;
    $("bottom").hidden = true;
  }
}

document.addEventListener("keydown", e => {
  const inField = ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName);
  if (e.key === "Enter" && (!inField || e.ctrlKey || e.metaKey)) { e.preventDefault(); next(); return; }
  if (inField || $("bottom").hidden) return;
  if (/^[1-9]$/.test(e.key) && TYPES[+e.key - 1]) toggle(TYPES[+e.key - 1]);
  else if (e.key === "ArrowRight") go(current + 1);
  else if (e.key === "ArrowLeft") go(current - 1);
  else if (e.key.toLowerCase() === "d") { const d = $("doc"); if (d) d.open = !d.open; }
});
$("types").addEventListener("click", e => { const b = e.target.closest("button"); if (b) toggle(b.dataset.type) });
$("list").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i) });
$("next").addEventListener("click", next);
$("comment").addEventListener("change", () => save());
$("reviewer").addEventListener("change", () => storeLocal("reviewer", $("reviewer").value));

const IN_APP = location.pathname.startsWith("/review/");
let RUN = "<run>";
fetch("api/cases").then(r => r.json()).then(d => {
  if (!d.cases) throw new Error(d.error);
  RUN = d.run;
  if (d.test) { $("test-band").hidden = false; document.body.classList.add("test"); }
  if (IN_APP) { $("back").hidden = false; $("back").href = "../../#" + encodeURIComponent(RUN); }
  CASES = d.cases; TYPES = d.error_types;
  document.title = "Figures in Context Review – " + d.run;
  $("title").textContent = "Review " + d.run;
  $("reviewer").value = loadLocal("reviewer") || (CASES.find(c => c.reviewer) || {}).reviewer || "";
  const open = CASES.findIndex(c => !c.checked);
  current = open >= 0 ? open : 0;
  showCase();
}).catch(e => { $("main").innerHTML = `<div class="finished"><h2>Review not available</h2><p>${e.message && e.message !== "Failed to fetch" ? esc(e.message) : "No connection. Is the Figures in Context window still open?"}</p></div>`; $("bottom").hidden = true; });
</script>
</body>
</html>
