<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figures in Context</title>
<style>
:root{
  --ink:#1B2430; --ink-2:#2A3544; --ink-3:#3A4656; --mist:#C9D1DA;
  --slate:#5B6672; --line:#D5DBE1; --ground:#EEF1F4; --paper:#FFFFFF;
  --tape:#FBFAF5; --tape-line:#E6E2D6;
  --green:#2E6B4F; --green-light:#E3F0E8; --red:#B3261E; --red-light:#F8E3E1; --amber:#C98A1B; --amber-light:#FBF0DC;
  --mono:"Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Layout: sidebar left, content right ---------- */
.app{display:grid;grid-template-columns:16rem 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:var(--mist);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:1.1rem 1.25rem .9rem;border-bottom:1px solid var(--ink-2)}
.brand b{display:block;color:#fff;font-size:1.05rem;letter-spacing:.01em}
.brand span{font-size:.78rem}
.sidebar nav{display:flex;flex-direction:column;padding:.6rem .6rem 0}
.sidebar nav a{text-decoration:none;padding:.45rem .65rem;border-radius:5px;font-size:.92rem}
.sidebar nav a:hover{background:var(--ink-2);color:#fff}
.sidebar nav a[aria-current="page"]{background:var(--ink-2);color:#fff;box-shadow:inset 3px 0 0 #7FC29B}
.sidebar h2{font-size:.78rem;font-weight:600;color:#8D99A6;margin:1.25rem 1.25rem .4rem}
.run-list{display:flex;flex-direction:column;padding:0 .6rem}
.run-list a{text-decoration:none;padding:.4rem .65rem;border-radius:5px;font-size:.88rem;display:block}
.run-list a:hover{background:var(--ink-2);color:#fff}
.run-list a[aria-current="true"]{background:var(--ink-2);color:#fff}
.run-list small{display:block;font-size:.75rem;color:#8D99A6}
.dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#7FC29B;margin-left:.35rem;vertical-align:1px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.new-run{margin:.5rem 1.25rem 1.25rem;display:flex;flex-direction:column;gap:.45rem}
.new-run input[type=text]{background:var(--ink-2);border:1px solid var(--ink-3);color:#fff;border-radius:5px;padding:.4rem .6rem}
.new-run input::placeholder{color:#8D99A6}
.new-run label{font-size:.82rem;display:flex;gap:.45rem;align-items:center}
.new-run button{background:#7FC29B;color:var(--ink);border:0;border-radius:5px;padding:.45rem;font-weight:600;cursor:pointer}
.new-run button:hover{background:#9AD3B1}
.new-run .message{font-size:.8rem;color:#F2B8B5}
.sidebar .footer{margin-top:auto;padding:1rem 1.25rem;font-size:.78rem;border-top:1px solid var(--ink-2)}
.sidebar .footer.problem{color:#F2B8B5}

.content{min-width:0;padding:1.75rem 2rem 4rem}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:1.75rem;align-items:start}

/* ---------- Run header ---------- */
.title{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;margin-bottom:.15rem}
.title h1{font-size:1.6rem;line-height:1.2;margin:0;font-weight:650}
.quiet{color:var(--slate);font-size:.88rem}
.tag{font-size:.75rem;font-weight:600;border-radius:3px;padding:.05rem .4rem}
.tag.test{background:var(--amber-light);color:#8A5D0E}
.tag.ok{background:var(--green-light);color:var(--green)}
.tag.no{background:var(--red-light);color:var(--red)}

/* Progress as a chain of five stages */
.chain{display:grid;grid-template-columns:repeat(5,1fr);margin:1.5rem 0 1.25rem;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.stage{padding:.75rem .9rem .8rem;border-right:1px solid var(--line);position:relative}
.stage:last-child{border-right:0}
.stage .name{font-size:.82rem;color:var(--slate);display:flex;align-items:center;gap:.4rem}
.stage .value{font-size:1.15rem;font-weight:600;margin-top:.1rem}
.stage .of{font-size:.85rem;color:var(--slate);font-weight:400}
.stage .track{position:absolute;left:0;bottom:0;height:3px;background:var(--green);transition:width .4s}
.stage.done .name::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--green)}
.stage.partial .name::before{content:"";width:.55rem;height:.55rem;border-radius:50%;border:2px solid var(--amber)}
.stage.open .name::before{content:"";width:.55rem;height:.55rem;border-radius:50%;border:2px solid var(--line)}
.stage.partial .track{background:var(--amber)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.7rem .9rem}
.tile b{display:block;font-size:1.7rem;line-height:1.15;font-weight:650}
.tile span{font-size:.82rem;color:var(--slate)}
.tile.good b{color:var(--green)} .tile.bad b{color:var(--red)}

.buttons{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:5px;padding:.5rem 1rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{background:var(--ink-2)}
.btn.secondary{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{background:var(--ground)}
.btn:disabled{opacity:.45;cursor:default}

.notice{border-left:4px solid var(--amber);background:var(--amber-light);padding:.6rem .9rem;border-radius:4px;font-size:.9rem;margin-top:1rem}
.notice.error{border-color:var(--red);background:var(--red-light)}
.notice.ok{border-color:var(--green);background:var(--green-light)}
.files{margin-top:1.5rem;font-size:.88rem;color:var(--slate)}
.files a{margin-right:.75rem}

/* ---------- The receipt tape: the log ---------- */
.tape{position:sticky;top:1.25rem;background:var(--tape);border:1px solid var(--tape-line);border-radius:3px;
  box-shadow:0 1px 0 var(--tape-line),0 10px 24px -18px rgba(27,36,48,.5);display:flex;flex-direction:column;max-height:calc(100vh - 2.5rem)}
.tape::before,.tape::after{content:"";position:absolute;left:0;right:0;height:6px;
  background:radial-gradient(circle at 5px 3px,var(--ground) 2.5px,transparent 3px) 0 0/10px 6px repeat-x}
.tape::before{top:-4px} .tape::after{bottom:-4px}
.tape-head{padding:.9rem 1rem .6rem;border-bottom:1px dashed var(--tape-line)}
.tape-head h2{font-size:.95rem;margin:0 0 .5rem;display:flex;justify-content:space-between;align-items:baseline}
.tape-head h2 small{font-weight:400;color:var(--slate);font-size:.78rem}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:.25rem .5rem;font-family:var(--mono);font-size:.78rem}
.summary div{display:flex;flex-direction:column}
.summary b{font-size:.92rem}
.summary span{color:var(--slate);font-family:system-ui,sans-serif;font-size:.72rem}
.filter{display:flex;gap:.3rem;margin-top:.7rem;flex-wrap:wrap}
.filter button{border:1px solid var(--tape-line);background:transparent;border-radius:999px;padding:.1rem .6rem;font-size:.78rem;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lines{overflow:auto;font-family:var(--mono);font-size:.76rem;line-height:1.45;padding:.4rem 0 .8rem;min-height:8rem}
.line{display:grid;grid-template-columns:4.1rem minmax(6rem,1fr) auto 3.6rem;gap:.5rem;padding:.25rem 1rem;cursor:default;border-left:3px solid transparent}
.line.clickable{cursor:pointer}
.line.clickable:hover{background:#F2F0E8}
.line .time{color:#9AA3AD}
.line .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .right{text-align:right;color:var(--slate);white-space:nowrap}
.line .res{text-align:right;white-space:nowrap;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis}
.line.info .what,.line.warning .what,.line.error .what{grid-column:2/-1;}
.line.info .what,.line.warning .what{white-space:normal;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--slate)}
.line.warning{border-left-color:var(--amber)} .line.warning .what{color:#8A5D0E}
.line.error{border-left-color:var(--red);background:#FCEFEE} .line.error .what{color:var(--red);white-space:normal}
.line .ok{color:var(--green)} .line .flag{color:var(--red);font-weight:600}
.line .detail{grid-column:2/-1;white-space:pre-wrap;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--ink);background:var(--paper);border:1px solid var(--tape-line);border-radius:3px;padding:.45rem .6rem;margin:.25rem 0 .2rem}
.tape-empty{padding:1.5rem 1rem;color:var(--slate);font-family:system-ui,sans-serif;font-size:.85rem}
.live{font-size:.75rem;color:var(--green);font-weight:600}

/* ---------- Calibration and settings ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.25rem}
.card + .card{margin-top:1rem}
.card h2{font-size:1.1rem;margin:0 0 .35rem}
.card h3{font-size:.9rem;color:var(--slate);margin:1rem 0 .5rem;font-weight:600}
.table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.5rem}
.table th{text-align:left;font-weight:600;color:var(--slate);font-size:.82rem;border-bottom:1px solid var(--line);padding:.35rem .5rem}
.table td{border-bottom:1px solid var(--ground);padding:.45rem .5rem;vertical-align:top}
.grid{display:grid;grid-template-columns:11rem 1fr;gap:.6rem 1rem;align-items:center}
input[type=text],input[type=password],input[type=number],select{border:1px solid var(--line);border-radius:4px;padding:.38rem .55rem;background:var(--paper);min-width:0}
.model-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 7rem 2rem;gap:.5rem;margin-bottom:.45rem;align-items:center}
.model-row .remove{border:0;background:none;cursor:pointer;color:var(--slate);font-size:1.1rem}
.key-status{font-size:.8rem}
.key-status.yes{color:var(--green)} .key-status.no{color:var(--red)}
.message{font-size:.88rem;align-self:center}
.empty{text-align:center;padding:4rem 1rem;color:var(--slate)}
.empty h1{color:var(--ink);font-size:1.4rem;margin:0 0 .5rem}

@media (max-width:1100px){ .two-col{grid-template-columns:1fr} .tape{position:static;max-height:32rem} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto}
  .sidebar nav{flex-direction:row;flex-wrap:wrap}
  .run-list{flex-direction:row;overflow-x:auto;padding-bottom:.5rem}
  .run-list a{white-space:nowrap}
  .sidebar .footer{display:none}
  .content{padding:1.25rem 1rem 3rem}
  .chain{grid-template-columns:repeat(3,1fr)} .stage{border-bottom:1px solid var(--line)}
  .tiles{grid-template-columns:1fr 1fr 1fr} .tile b{font-size:1.3rem}
  .grid{grid-template-columns:1fr}
  .model-row{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><b>Figures in Context</b><span>Does the AI understand the document despite the numbers?</span></div>
    <nav>
      <a href="#" id="nav-runs">Runs</a>
      <a href="#calibration" id="nav-cal">Calibration</a>
      <a href="#settings" id="nav-settings">Settings</a>
    </nav>
    <h2>Runs</h2>
    <div class="run-list" id="run-list"></div>
    <form class="new-run" id="new">
      <input type="text" id="new-name" placeholder="New run, e.g. pilot" required aria-label="Name of the new run">
      <label><input type="checkbox" id="new-test"> Test run with test models (free)</label>
      <button>Create run</button>
      <div class="message" id="new-message" role="status"></div>
    </form>
    <div class="footer" id="info"></div>
  </aside>
  <main class="content" id="page"></main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PROVIDERS = ["anthropic", "openai", "google", "test"];
const JUDGES = {numbers: "Numbers judge", calculation: "Calculation judge", plausibility: "Plausibility judge"};
const num = n => (n ?? 0).toLocaleString("en-US");
let STATUS = null, timer = null;

async function api(path, body){
  const opt = body === undefined ? {} : {method: "POST", body: JSON.stringify(body),
    headers: {"Content-Type": "application/json", "X-Figures-In-Context": "1"}};
  let r;
  try { r = await fetch(path, opt) } catch { throw new Error("No connection. Is the Figures in Context window still open?") }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

async function load(fromTimer){
  try { STATUS = await api("api/status") }
  catch (e) { $("page").innerHTML = `<div class="notice error">${esc(e.message)}</div>`; return }
  const p = STATUS.test_case_problems.length;
  $("info").textContent = `${STATUS.test_cases} test cases loaded` + (p ? `, ${p} with problems` : "");
  $("info").classList.toggle("problem", !!p);
  // don't redraw the settings while someone is typing there
  if (!(fromTimer && location.hash === "#settings")) show();
  clearTimeout(timer);
  if (STATUS.job && STATUS.job.running) timer = setTimeout(() => load(true), 1500);
}

function route(){
  const target = decodeURIComponent(location.hash.slice(1));
  return {target, section: ["settings", "calibration"].includes(target) ? target : "runs"};
}

function show(){
  const {target, section} = route();
  $("nav-runs").setAttribute("aria-current", section === "runs" ? "page" : "false");
  $("nav-cal").setAttribute("aria-current", section === "calibration" ? "page" : "false");
  $("nav-settings").setAttribute("aria-current", section === "settings" ? "page" : "false");
  const active = section === "runs" ? (target && STATUS.runs.some(r => r.name === target) ? target : (STATUS.runs[0] || {}).name) : null;
  showRunList(active);
  if (section === "settings") return showSettings();
  if (section === "calibration") return showCalibration();
  showRun(active);
}

function isRunning(name){ return STATUS.job && STATUS.job.running && STATUS.job.name === name }

function showRunList(active){
  $("run-list").innerHTML = STATUS.runs.map(r => `<a href="#${encodeURIComponent(r.name)}" aria-current="${r.name === active}">
    ${esc(r.name)}${isRunning(r.name) ? '<span class="dot" title="running"></span>' : ""}<small>${r.error ? "not readable" : (r.test ? "test run, " : "") + shortState(r)}</small></a>`).join("")
    || '<span class="quiet" style="padding:0 .65rem;color:#8D99A6">No runs yet</span>';
}

function shortState(r){
  if (r.report) return "report created";
  if (r.review_total) return `review ${r.review_checked} of ${r.review_total}`;
  if (r.answers) return `${r.answers} of ${r.answers_expected} answers`;
  return "not started yet";
}

function missingKeys(){
  const needed = new Set([...STATUS.config.models_under_test, ...Object.values(STATUS.config.judges)]
    .map(t => t.provider).filter(p => p !== "test"));
  return [...needed].filter(p => !STATUS.keys[p]);
}

// ---------- One run ----------
function stage(name, done, expected, text){
  const share = expected ? Math.min(1, done / expected) : 0;
  const state = expected && done >= expected ? "done" : done ? "partial" : "open";
  return `<div class="stage ${state}"><div class="name">${name}</div>
    <div class="value">${text ?? (expected ? `${num(done)} <span class="of">of ${num(expected)}</span>` : "–")}</div>
    <i class="track" style="width:${share * 100}%"></i></div>`;
}

function showRun(name){
  if (!name) {
    $("page").innerHTML = `<div class="empty"><h1>No run yet</h1>
      <p>Create a run on the left. With "Test run" everything runs on test models, without API costs.</p></div>`;
    return;
  }
  const r = STATUS.runs.find(x => x.name === name);
  if (r.error) { $("page").innerHTML = `<div class="notice error">${esc(r.error)}</div>`; return }
  const job = STATUS.job && STATUS.job.name === name ? STATUS.job : null;
  const running = job && job.running;
  const otherRunning = STATUS.job && STATUS.job.running && !job;
  const progress = running && job.progress.match(/^(\w+): (\d+)\/(\d+)$/);
  let answers = r.answers, verdicts = r.verdicts;
  if (progress && progress[1] === "Answers") answers = Math.max(answers, +progress[2]);
  if (progress && progress[1] === "Judges") verdicts = Math.max(verdicts, +progress[2]);
  const checked = r.correct + r.wrong + r.format_errors;
  const complete = r.answers >= r.answers_expected && r.verdicts >= r.verdicts_expected && r.review_total;
  const missing = r.test ? [] : missingKeys();

  let notice = "";
  if (running) notice = `<div class="notice">Running. The log on the right shows every request as soon as it comes back.</div>`;
  else if (job && job.outcome === "done" && r.review_checked < r.review_total) notice = `<div class="notice ok">Done. Now check the flagged cases in the review.</div>`;
  else if (job && job.outcome === "incomplete") notice = `<div class="notice error">Not all requests succeeded; the errors are in red in the log. "Resume" only requests what is missing.</div>`;
  else if (job && job.outcome === "failed") notice = `<div class="notice error">The run stopped: ${esc(job.log[job.log.length - 1] || "")}</div>`;
  if (!running && missing.length && !complete) notice += `<div class="notice error">API keys are missing for ${missing.join(", ")}. <a href="#settings">Add them in the settings</a>.</div>`;

  const startText = running ? "Running …" : r.answers ? "Resume" : "Start run";
  $("page").innerHTML = `<div class="two-col"><section>
    <div class="title"><h1>${esc(r.name)}</h1>${r.test ? '<span class="tag test">Test run</span>' : ""}</div>
    <div class="quiet">Tested: ${r.models.map(esc).join(", ")}</div>
    ${r.test ? `<div class="notice">Test run: test models answer and judge at random, so you can try the whole flow without cost. Reported errors are not real findings.</div>` : ""}
    <div class="chain">
      ${stage("Answers", answers, r.answers_expected)}
      ${stage("Python check", checked, r.answers_expected)}
      ${stage("Judges", verdicts, r.verdicts_expected)}
      ${stage("Review", r.review_checked, r.review_total)}
      ${stage("Report", r.report ? 1 : 0, 1, r.report ? "created" : "–")}
    </div>
    ${checked ? `<div class="tiles">
      <div class="tile good"><b>${num(r.correct)}</b><span>result correct</span></div>
      <div class="tile ${r.wrong ? "bad" : ""}"><b>${num(r.wrong)}</b><span>result wrong</span></div>
      <div class="tile"><b>${num(r.format_errors)}</b><span>format errors, not counted</span></div></div>` : ""}
    <div class="buttons">
      ${!complete || running ? `<button class="btn" id="start" ${running || otherRunning || missing.length ? "disabled" : ""}>${startText}</button>` : ""}
      ${r.review_total ? `<a class="btn${complete && r.review_checked < r.review_total ? "" : " secondary"}" href="review/${encodeURIComponent(r.name)}/">Open review</a>` : ""}
      ${r.review_total ? `<button class="btn${r.review_checked >= r.review_total && !r.report ? "" : " secondary"}" id="make-report" ${running ? "disabled" : ""}>${r.report ? "Recreate report" : "Create report"}</button>` : ""}
      ${r.report ? `<a class="btn secondary" href="runs/${encodeURIComponent(r.name)}/report.html" target="_blank">View report</a>` : ""}
    </div>
    ${otherRunning ? `<p class="quiet">${esc(STATUS.job.name)} is running right now. Only one thing runs at a time.</p>` : ""}
    ${r.review_total && r.review_checked < r.review_total ? `<p class="quiet">You can create the report before the review is finished. Unchecked cases then count as provisional.</p>` : ""}
    ${notice}
    ${r.review_total || r.report ? `<div class="files">Files:
      ${["review_queue.csv", "review_results.csv", "report.md"].map(f => `<a href="runs/${encodeURIComponent(r.name)}/${f}">${f}</a>`).join("")}</div>` : ""}
    </section>
    ${tapeHtml()}</div>`;

  const start = $("start"), makeReport = $("make-report");
  if (start) start.addEventListener("click", async () => {
    start.disabled = true;
    try { await api(`api/runs/${encodeURIComponent(name)}/start`, {}); await load() }
    catch (err) { alert(err.message); start.disabled = false }
  });
  if (makeReport) makeReport.addEventListener("click", async () => {
    makeReport.disabled = true; makeReport.textContent = "Creating …";
    try { await api(`api/runs/${encodeURIComponent(name)}/report`, {}); await load() }
    catch (err) { alert(err.message); makeReport.disabled = false }
  });
  connectTape(`api/runs/${encodeURIComponent(name)}/log`, running);
}

// ---------- The log as a receipt tape ----------
const TAPE = {source: null, entries: [], total: 0, summary: null, filter: "all", open: new Set(), atEnd: true, top: 0};

function tapeHtml(){
  return `<aside class="tape" aria-label="Log">
    <div class="tape-head">
      <h2>Log <small id="tape-live"></small></h2>
      <div class="summary" id="summary"></div>
      <div class="filter" id="filter">
        ${[["all", "All"], ["answer", "Answers"], ["verdict", "Judges"], ["error", "Errors"]]
          .map(([k, t]) => `<button type="button" data-f="${k}" aria-pressed="${TAPE.filter === k}">${t}</button>`).join("")}
      </div>
    </div>
    <div class="lines" id="lines"><div class="tape-empty">Loading …</div></div>
  </aside>`;
}

async function connectTape(source, live){
  if (TAPE.source !== source) Object.assign(TAPE, {source, entries: [], total: 0, summary: null, open: new Set(), atEnd: true, top: 0});
  // keep the scroll position across redraws: whoever scrolled up isn't yanked back down
  $("lines").addEventListener("scroll", e => {
    const b = e.target; TAPE.top = b.scrollTop; TAPE.atEnd = b.scrollHeight - b.scrollTop - b.clientHeight < 40;
  });
  $("filter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    TAPE.filter = b.dataset.f;
    document.querySelectorAll("#filter button").forEach(x => x.setAttribute("aria-pressed", x === b));
    TAPE.atEnd = true; drawTape();
  });
  $("lines").addEventListener("click", e => {
    const l = e.target.closest(".line.clickable"); if (!l) return;
    const i = +l.dataset.i; TAPE.open.has(i) ? TAPE.open.delete(i) : TAPE.open.add(i);
    drawTape();
  });
  $("tape-live").innerHTML = live ? '<span class="live">live</span>' : "";
  drawTape();
  try {
    const d = await api(`${source}?from=${TAPE.total}`);
    if (TAPE.source !== source) return;
    if (d.total < TAPE.total) { TAPE.entries = []; }
    TAPE.entries.push(...d.entries);
    TAPE.total = d.total; TAPE.summary = d.summary;
    if ($("lines")) drawTape();
  } catch (e) { if ($("lines")) $("lines").innerHTML = `<div class="tape-empty">${esc(e.message)}</div>` }
}

function clock(s){ return s ? s.slice(11, 19) : "" }
function secs(s){ return s == null ? "" : s < 60 ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s` }
function shortTokens(n){ return n >= 1e6 ? `${(n / 1e6).toFixed(2)}M` : n >= 1e4 ? `${Math.round(n / 1e3)}k` : num(n) }

function lineHtml(e, i){
  const open = TAPE.open.has(i);
  if (e.kind === "answer") {
    return `<div class="line clickable" data-i="${i}" title="Click for details"><span class="time">${clock(e.time)}</span>
      <span class="what">${esc(e.case_id)} ${esc(e.model)}${e.repetition > 1 ? " #" + e.repetition : ""}</span>
      <span class="res">${esc(e.result)}</span><span class="right">${secs(e.duration_s)}</span>
      ${open ? `<div class="detail">Answer from ${esc(e.model)} to ${esc(e.case_id)}
Result: ${esc(e.result)}
Tokens: ${num(e.tokens_in)} in, ${num(e.tokens_out)} out
Duration: ${secs(e.duration_s)}${e.attempts > 1 ? `, ${e.attempts} attempts` : ""}
Stop reason: ${esc(e.stop_reason)}</div>` : ""}</div>`;
  }
  if (e.kind === "verdict") {
    const verdict = e.flag ? `<span class="flag">${e.error_types.length ? esc(e.error_types.join(", ")) : "flag"}</span>` : '<span class="ok">ok</span>';
    const short = {numbers: "numbers", calculation: "calculation", plausibility: "plausibility"}[e.judge] || e.judge;
    return `<div class="line clickable" data-i="${i}" title="Click for details"><span class="time">${clock(e.time)}</span>
      <span class="what">${esc(e.case_id)} ${esc(short)}</span>
      <span class="res">${verdict}</span><span class="right">${secs(e.duration_s)}</span>
      ${open ? `<div class="detail">${esc(JUDGES[e.judge] || e.judge)} (${esc(e.judge_model)}) on the answer from ${esc(e.model)} to ${esc(e.case_id)}
${e.judge_error ? "Broken verdict, counts as a flag.\n" : ""}Finding: ${esc(e.finding)}
Tokens: ${num(e.tokens_in)} in, ${num(e.tokens_out)} out
Duration: ${secs(e.duration_s)}${e.attempts > 1 ? `, ${e.attempts} attempts` : ""}</div>` : ""}</div>`;
  }
  return `<div class="line ${esc(e.kind)}"><span class="time">${clock(e.time)}</span><span class="what">${esc((e.text || "").trim())}</span></div>`;
}

function drawTape(){
  const box = $("lines"); if (!box) return;
  const s = TAPE.summary;
  $("summary").innerHTML = s ? `
    <div><b>${num(s.requests)}</b><span>requests</span></div>
    <div><b style="color:${s.errors ? "var(--red)" : "inherit"}">${num(s.errors)}</b><span>errors</span></div>
    <div><b>${shortTokens(s.tokens_in + s.tokens_out)}</b><span>tokens</span></div>
    <div><b>${s.requests ? secs(s.duration_s / s.requests) : "–"}</b><span>per request</span></div>` : "";
  const f = TAPE.filter;
  const list = TAPE.entries.map((e, i) => [e, i]).filter(([e]) => f === "all" || e.kind === f);
  box.innerHTML = list.length ? list.map(([e, i]) => lineHtml(e, i)).join("")
    : `<div class="tape-empty">${TAPE.total || TAPE.summary ? "Nothing for this filter." : "Nothing has happened yet. Once the run starts, every request shows up here with model, duration and result."}</div>`;
  box.scrollTop = TAPE.atEnd ? box.scrollHeight : TAPE.top;
}

// ---------- Calibration ----------
function showCalibration(){
  const job = STATUS.job, running = job && job.running;
  const calJob = job && job.name.startsWith("calibration:") ? job : null;
  const needed = [...new Set(Object.values(STATUS.config.judges).map(t => t.provider).filter(p => p !== "test"))];
  const missing = needed.filter(p => !STATUS.keys[p]);
  const latest = STATUS.calibrations[0];
  const unfinished = latest && !latest.result && !(calJob && calJob.running) ? latest : null;
  const progress = calJob && calJob.running && calJob.progress.match(/^Judges: (\d+)\/(\d+)$/);

  $("page").innerHTML = `<div class="two-col"><section>
    <div class="title"><h1>Judge calibration</h1></div>
    <p>Do the judges find errors we planted on purpose? ${STATUS.calibration_answers} answers to your test cases:
    invented numbers, wrong sources, calculation errors and missing required information, plus clean answers.
    A judge passes when it finds every planted error in its area and flags no clean answer.</p>
    <p class="quiet">It uses the judges from the settings: ${Object.entries(STATUS.config.judges).map(([j, t]) => `${JUDGES[j] || j} ${esc(t.provider)}:${esc(t.model)}`).join(", ")}.</p>
    ${missing.length ? `<div class="notice error">API keys are missing for ${missing.join(", ")}. <a href="#settings">Add them</a>.</div>` : ""}
    <div class="buttons">
      <button class="btn" id="cal-start" ${running || missing.length ? "disabled" : ""}>${calJob && calJob.running ? "Running …" : "Start calibration"}</button>
      ${unfinished ? `<button class="btn secondary" id="cal-resume" ${running || (missing.length && !unfinished.test) ? "disabled" : ""}>Resume the stopped one</button>` : ""}
      <button class="btn secondary" id="cal-test" ${running ? "disabled" : ""}>Try with test models</button>
    </div>
    ${running && !calJob ? `<p class="quiet">${esc(job.name)} is running right now. Only one thing runs at a time.</p>` : ""}
    ${progress ? `<div class="chain" style="grid-template-columns:1fr">${stage("Judge verdicts", +progress[1], +progress[2])}</div>` : ""}
    ${calJob && calJob.outcome === "incomplete" ? `<div class="notice error">Not all judge requests succeeded. Press "Resume the stopped one".</div>` : ""}
    ${calJob && calJob.outcome === "failed" ? `<div class="notice error">Stopped: ${esc(calJob.log[calJob.log.length - 1] || "")}</div>` : ""}
    <div style="margin-top:1.25rem">${STATUS.calibrations.filter(c => c.result).map(calCard).join("")}</div>
    </section>
    ${latest ? tapeHtml() : ""}</div>`;

  const go = async (body, button) => {
    button.disabled = true;
    try { await api("api/calibration", body); await load() }
    catch (err) { alert(err.message); button.disabled = false }
  };
  $("cal-start").addEventListener("click", e => go({}, e.target));
  $("cal-test").addEventListener("click", e => go({test: true}, e.target));
  if ($("cal-resume")) $("cal-resume").addEventListener("click", e => go({name: unfinished.name}, e.target));
  if (latest) connectTape(`api/calibrations/${encodeURIComponent(latest.name)}/log`, calJob && calJob.running);
}

function calCard(c){
  const rows = Object.entries(c.result).map(([j, e]) => `<tr>
      <td>${JUDGES[j] || esc(j)}<div class="quiet">${esc(c.judges[j] || "")}</div></td>
      <td>${e.hits} of ${e.expected}</td>
      <td>${e.false_alarms} of ${e.clean}</td>
      <td>${e.broken}</td>
      <td>${e.passed ? '<span class="tag ok">passed</span>' : '<span class="tag no">needs work</span>'}</td></tr>`).join("");
  return `<div class="card">
    <h3 style="margin-top:0">${esc(c.name)} ${c.test ? '<span class="tag test">test</span>' : ""}</h3>
    <table class="table"><tr><th>Judge</th><th>Errors found</th><th>False alarms</th><th>Broken verdicts</th><th></th></tr>${rows}</table>
    <div class="buttons"><a class="btn secondary" href="calibrations/${encodeURIComponent(c.name)}/calibration.html" target="_blank">Details: what was missed?</a></div>
  </div>`;
}

// ---------- Settings ----------
function modelRow(t, removable){
  return `<div class="model-row">
    <select aria-label="Provider">${PROVIDERS.map(p => `<option ${p === t.provider ? "selected" : ""}>${p}</option>`).join("")}</select>
    <input type="text" aria-label="Model name" value="${esc(t.model)}" placeholder="model name">
    <input type="text" aria-label="Effort (optional)" value="${esc(t.effort || "")}" placeholder="effort">
    ${removable ? '<button type="button" class="remove" title="Remove" aria-label="Remove">×</button>' : "<span></span>"}</div>`;
}
const readRow = row => { const [p, m, e] = row.querySelectorAll("select,input"); return {provider: p.value, model: m.value, effort: e.value.trim()} };

function showSettings(){
  const c = STATUS.config;
  $("page").innerHTML = `<div style="max-width:52rem">
    <div class="title"><h1>Settings</h1></div>
    <form class="card" id="f-keys" style="margin-top:1rem">
      <h2>API keys</h2>
      <p class="quiet">Stored only locally in the <code>.env</code> file in the project folder and never shown. Leave a field empty to keep the current key.</p>
      <div class="grid">
        ${[["anthropic", "Anthropic"], ["openai", "OpenAI"], ["google", "Google (Gemini)"]].map(([p, n]) => `
          <label for="k-${p}">${n} <span class="key-status ${STATUS.keys[p] ? "yes" : "no"}">${STATUS.keys[p] ? "set" : "missing"}</span></label>
          <input type="password" id="k-${p}" autocomplete="off" placeholder="${STATUS.keys[p] ? "•••••••• (set)" : "paste key"}">`).join("")}
      </div>
      <div class="buttons"><button class="btn">Save keys</button><span class="message" id="m-keys" role="status"></span></div>
    </form>

    <form class="card" id="f-config">
      <h2>Models and run</h2>
      <p class="quiet">Applies to new runs. Existing runs keep their settings.</p>
      <h3>Models under test</h3>
      <div id="models-under-test">${c.models_under_test.map(t => modelRow(t, true)).join("")}</div>
      <button type="button" class="btn secondary" id="plus">Add model</button>
      <h3>Judges, ideally from other model families than the model under test</h3>
      ${Object.entries(JUDGES).map(([j, n]) => `<div class="quiet">${n}</div><div data-judge="${j}">${modelRow(c.judges[j] || {provider: "openai", model: ""}, false)}</div>`).join("")}
      <h3>Procedure</h3>
      <div class="grid">
        <label for="reps">Repetitions per question</label><input type="number" id="reps" min="1" max="10" value="${c.repetitions}">
        <label for="share">Sample in percent</label><input type="number" id="share" min="0" max="100" value="${Math.round(c.sample.share * 100)}">
        <label for="minimum">Sample at least</label><input type="number" id="minimum" min="0" value="${c.sample.minimum}">
      </div>
      <div class="buttons"><button class="btn" id="config-save">Save settings</button><span class="message" id="m-config" role="status"></span></div>
    </form></div>`;

  const say = (id, text, ok) => { $(id).textContent = text; $(id).style.color = ok ? "var(--green)" : "var(--red)" };
  $("f-keys").addEventListener("submit", async e => {
    e.preventDefault();
    const body = {anthropic: $("k-anthropic").value, openai: $("k-openai").value, google: $("k-google").value};
    if (!Object.values(body).some(v => v.trim())) return say("m-keys", "Nothing entered.", false);
    try { await api("api/keys", body); await load(); say("m-keys", "Saved.", true) }
    catch (err) { say("m-keys", err.message, false) }
  });
  $("plus").addEventListener("click", () => $("models-under-test").insertAdjacentHTML("beforeend", modelRow({provider: "openai", model: ""}, true)));
  $("models-under-test").addEventListener("click", e => { if (e.target.classList.contains("remove")) e.target.closest(".model-row").remove() });
  $("f-config").addEventListener("submit", async e => {
    e.preventDefault();
    const judges = {};
    document.querySelectorAll("[data-judge]").forEach(d => judges[d.dataset.judge] = readRow(d.querySelector(".model-row")));
    try {
      await api("api/config", {
        models_under_test: [...$("models-under-test").querySelectorAll(".model-row")].map(readRow),
        judges, repetitions: +$("reps").value,
        sample: {share: +$("share").value / 100, minimum: +$("minimum").value}});
      await load(); say("m-config", "Saved.", true);
    } catch (err) { say("m-config", err.message, false) }
  });
}

// ---------- New run (sidebar) ----------
$("new").addEventListener("submit", async e => {
  e.preventDefault();
  $("new-message").textContent = "";
  try {
    const d = await api("api/runs", {name: $("new-name").value, test: $("new-test").checked});
    $("new-name").value = ""; $("new-test").checked = false;
    location.hash = encodeURIComponent(d.name);
    await load();
  } catch (err) { $("new-message").textContent = err.message }
});

window.addEventListener("hashchange", () => STATUS && show());
window.addEventListener("focus", () => { if (!(STATUS && STATUS.job && STATUS.job.running) && location.hash !== "#settings") load() });
load();
</script>
</body>
</html>
